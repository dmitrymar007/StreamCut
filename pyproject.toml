[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "streamcut"
version = "0.2.0"
description = "Локальный редактор и поиск моментов в стримах"
requires-python = ">=3.13,<3.15"
dependencies = ["PySide6>=6.10,<7", "python-mpv>=1.0.8,<2", "pydantic>=2.12,<3", "httpx>=0.28,<1", "faster-whisper>=1.2,<2", "av>=16.1,<17"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14", "pyinstaller>=6", "py7zr>=1"]

[project.gui-scripts]
streamcut = "streamcut.__main__:main"

[tool.setuptools.packages.find]
include = ["streamcut*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
